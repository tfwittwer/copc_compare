[package]
name = "copc_compare"
version = "0.1.0"
edition = "2024"
description = "Cloud-to-cloud distances between COPC files, written out as COPC"
license = "MIT"

[dependencies]
anyhow = "1"
indicatif = "0.18"
kiddo = { version = "6", default-features = false, features = ["multi-threaded"] }
clap = { version = "4", features = ["derive"] }
copc-core = "0.10"
copc-streaming = "0.2"
las = "0.10"
laz = "0.12"
memmap2 = "0.9"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
pollster = "0.4"
rayon = "1"

# CPU-bound binary: cross-crate inlining into the las/laz codec loops.
[profile.release]
lto = "thin"
codegen-units = 1


[dev-dependencies]
byteorder = "1"
copc-reader = "0.10"
# Synthetic COPC fixtures (LAS/LAZ -> COPC) for the tests.
copc_converter = { path = "../tools/copc-converter" }

# Dependencies optimised in the dev profile too: the tests run kd-tree queries,
# COPC conversion and LAZ coding on a few hundred thousand points.
[profile.dev.package."*"]
opt-level = 3
