[package]
name = "copc_compare"
version = "0.1.1"
edition = "2024"
description = "Cloud-to-cloud distances between COPC files, written out as COPC"
license = "MIT"

[dependencies]
anyhow = "1"
indicatif = "0.18"
kiddo = { version = "6", default-features = false, features = ["multi-threaded"] }
clap = { version = "4", features = ["derive"] }
copc-core = "0.10"
copc-streaming = "0.2"
las = "0.10"
laz = "0.12"
memmap2 = "0.9"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
pollster = "0.4"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# CPU-bound binary: cross-crate inlining into the las/laz codec loops.
[profile.release]
lto = "thin"
codegen-units = 1


[features]
default = ["simd"]
# kiddo's handwritten SIMD leaf scans (AVX2 / AVX-512 on x86_64; nightly per
# kiddo's docs, use --no-default-features otherwise). ~17 % faster c2c.
simd = ["kiddo/simd"]

[dev-dependencies]
byteorder = "1"
copc-reader = "0.10"
# Synthetic COPC fixtures (LAS/LAZ -> COPC) for the tests. Its test data (not
# in the crates.io package) is read from a checkout, see README.
copc_converter = { git = "https://github.com/360-geo/copc-converter", tag = "v0.16.0" }

# Dependencies optimised in the dev profile too: the tests run kd-tree queries,
# COPC conversion and LAZ coding on a few hundred thousand points.
[profile.dev.package."*"]
opt-level = 3
